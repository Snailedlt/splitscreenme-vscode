name: Tester feedback
description: Something wrong, confusing or missing in a check, the VS Code extension, the Notepad++ plugin, ncdev or another editor.
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: Something in the **browser workbench**, **Learn** or the site's pages? That goes to [the workbench's form](https://github.com/Snailedlt/nucleuscoop-handler-testbench/issues/new?template=feedback.yml).
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Checks (a wrong or missing warning)
        - Try it or the debugger (what it says Nucleus does is wrong)
        - Suggestions, hovers or docs
        - VS Code extension
        - Notepad++ plugin
        - ncdev (command line)
        - Another editor (through ncdev lsp)
        - AI agent kit (Claude Code plugin, MCP)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a wrong warning, say what Nucleus actually does when you run the handler, if you know.
    validations:
      required: true
  - type: textarea
    id: handler
    attributes:
      label: Handler
      description: A Hub link, a workbench share link, or the smallest piece of handler code that shows it.
      render: js
  - type: input
    id: version
    attributes:
      label: Version
      description: The .vsix you installed (e.g. v0.6.0), or `ncdev --version`.
  - type: textarea
    id: context
    attributes:
      label: Details from the workbench
      description: Filled in for you when you open this form from the workbench (build, browser, settings, which handler; never your code). Please leave it as it is. A bot keeps a copy as the first comment.
      render: text
