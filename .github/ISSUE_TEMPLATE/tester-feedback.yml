name: Tester feedback
description: Something wrong, confusing or missing in the VS Code extension, the Notepad++ plugin, ncdev (and other editors), Try it or the workbench.
labels: [feedback]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Linter (a wrong or missing warning)
        - Try it (what it says Nucleus does is wrong)
        - Completion / hover / docs
        - Commands (New Handler, Package, Install, Hub)
        - Workbench (browser)
        - Notepad++ plugin
        - ncdev (command line, or another editor through ncdev lsp)
        - AI agent skill (Claude Code plugin)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a wrong warning, say what Nucleus actually does when you run the handler, if you know.
    validations:
      required: true
  - type: textarea
    id: handler
    attributes:
      label: Handler
      description: A Hub link, a workbench share link, or the smallest piece of handler code that shows it.
      render: js
  - type: input
    id: version
    attributes:
      label: Version
      description: The .vsix you installed (e.g. v0.1.0-beta.1), or "workbench".
  - type: textarea
    id: context
    attributes:
      label: Details from the workbench
      description: Filled in for you when you open this form from the workbench (build, browser, settings, which handler; never your code). Please leave it as it is. A bot keeps a copy as the first comment.
      render: text
