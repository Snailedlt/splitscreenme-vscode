name: Release
run-name: Release ${{ inputs.version || github.ref_name || 'next beta' }}
# Builds the .vsix, nucleus.js, ncdev.exe (the standalone tool with the Notepad++ plugin inside, #18/#19) and
# the offline workbench, and publishes them as a GitHub release with
# that version's CHANGELOG.md section as the notes. Run it by hand (leave the version empty for the
# next beta), or push a tag like v0.2.0-beta.1. The run's summary has the links and the Discord post.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag. Leave empty for the next beta of package.json''s version (e.g. v0.2.0-beta.2).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only from main (or a pushed tag)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow from main (this run is on ${{ github.ref_name }}): merge the release pull request first."
          exit 1
      - name: Which version? (checked before anything is built)
        id: version
        run: node scripts/release-version.mjs "${{ inputs.version }}"
        env: # a pushed tag already exists: then only check it matches package.json and has notes
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release notes (from CHANGELOG.md)
        run: node scripts/release-notes.mjs --tag "${{ steps.version.outputs.tag }}" > release-notes.md
      - run: npm run typecheck
      - run: npm test
      - name: The skill's generated files are committed (npm run build, then commit plugin/)
        run: git diff --exit-code -- plugin/
      - name: Build the offline workbench (workbench.html)
        run: |
          git clone --quiet --depth 1 https://github.com/Snailedlt/nucleuscoop-handler-testbench testbench
          cd testbench/playground && npm ci && node build.mjs --core ../.. --refresh-hub
          cp dist/workbench-standalone.html "$GITHUB_WORKSPACE/workbench.html"
      - name: Package
        run: npx vsce package --no-dependencies -o "splitscreenme-vscode-${{ steps.version.outputs.tag }}.vsix"
      - name: Build ncdev.exe (standalone, with the Notepad++ plugin) and test the Linux build of it
        run: |
          sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix g++-mingw-w64-i686-posix osslsigncode >/dev/null
          sh npp-plugin/build.sh
          node scripts/sea.mjs --require-plugin --targets win-x64,linux-x64
          node scripts/smoke-standalone.mjs dist-sea/ncdev-linux-x64
          grep ' ncdev.exe$' dist-sea/SHA256SUMS.txt > SHA256SUMS.txt
          cp dist-sea/ncdev.exe ncdev.exe
          (cd dist-sea && zip -q -X ../NcDev.zip NcDev.dll && mkdir -p x86 && cp NcDev-x86.dll x86/NcDev.dll && cd x86 && zip -q -X ../../NcDev-x86.zip NcDev.dll)
          sha256sum NcDev.zip NcDev-x86.zip > plugin-sha256.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          cp dist/cli.js nucleus.js
          gh release create "$TAG" "splitscreenme-vscode-$TAG.vsix" ncdev.exe SHA256SUMS.txt NcDev.zip NcDev-x86.zip nucleus.js workbench.html --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md $pre
      - name: Announce on Discord (when DISCORD_WEBHOOKS is set)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: |
          node scripts/release-notes.mjs --tag "$TAG" --discord --json > discord.json
          node scripts/announce.mjs discord.json
      - name: Summary (links and the Discord post)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          repo="https://github.com/${{ github.repository }}"
          {
            echo "## ✅ $TAG is out"
            echo
            echo "**Release:** $repo/releases/tag/$TAG · **Download:** [splitscreenme-vscode-$TAG.vsix]($repo/releases/download/$TAG/splitscreenme-vscode-$TAG.vsix)"
            echo
            echo "### 💬 Post this in the Discord thread"
            echo
            echo '```text'
            node scripts/release-notes.mjs --tag "$TAG" --discord
            echo '```'
            echo
            if [ -n "${{ secrets.DISCORD_WEBHOOKS != '' && 'yes' || '' }}" ]; then echo "Posted to Discord automatically (DISCORD_WEBHOOKS)."; else echo "To post it automatically next time, add a DISCORD_WEBHOOKS secret (one Discord webhook URL per line)."; fi
            echo
            echo "The intro page's download link and the extension's update note pick up the new version by themselves; ncdev update and the Notepad++ plugin see the new ncdev.exe."
            echo
            echo "Notepad++ plugin for Plugins Admin (nppPluginList, when it changed): \`$(cat plugin-sha256.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: What went wrong
        if: failure()
        run: |
          {
            echo "## ❌ Not released"
            echo
            echo "Nothing was published. Open the step marked ❌ above for the reason; a version or release-notes problem is explained at the top of the run."
          } >> "$GITHUB_STEP_SUMMARY"
