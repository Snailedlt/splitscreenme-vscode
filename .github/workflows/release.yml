name: Release
# Builds the .vsix and attaches it to a GitHub release (a prerelease when the version has a "-",
# e.g. v0.1.0-beta.1). Either push a tag like v0.1.0-beta.1, or run the workflow by hand with a
# version: GitHub then creates the tag on the commit it built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to create, e.g. v0.1.0-beta.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Release notes (CHANGELOG.md must have this version's section)
        run: node scripts/release-notes.mjs --tag "$VERSION" > release-notes.md
      - run: npm run typecheck
      - run: npm test
      - name: Build the offline workbench (workbench.html)
        run: |
          git clone --quiet --depth 1 https://github.com/Snailedlt/nucleuscoop-handler-testbench testbench
          cd testbench/playground && npm ci && node build.mjs --core ../.. --refresh-hub
          cp dist/workbench-standalone.html "$GITHUB_WORKSPACE/workbench.html"
      - name: Package
        run: npx vsce package --no-dependencies -o "splitscreenme-vscode-${VERSION}.vsix"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in v*) ;; *) echo "Version must start with v"; exit 1;; esac
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          cp dist/cli.js nucleus.js
          echo "Discord post:"; node scripts/release-notes.mjs --tag "$VERSION" --discord | tee -a "$GITHUB_STEP_SUMMARY"
          gh release create "$VERSION" "splitscreenme-vscode-${VERSION}.vsix" nucleus.js workbench.html --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.md $pre
