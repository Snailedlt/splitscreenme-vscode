name: Doc review
# A "Doc review" issue (.github/ISSUE_TEMPLATE/doc-review.yml): the bot adds the AI-written doc as it was, with what it's
# based on and links to the Nucleus source, as a comment the reporter can't remove. It stays as it was when the issue
# was opened, even if the doc changes later. Only reads data/claude-docs.json; never runs code from the issue.
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
jobs:
  attach-doc:
    if: contains(github.event.issue.labels.*.name, 'doc-review') || contains(github.event.issue.body, '### Which name')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/claude-docs.json
            scripts/issue-bots.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            // The logic is in scripts/issue-bots.mjs (tested by src/test/bots.test.ts).
            const fs = require('fs');
            const bots = await import(`${process.env.GITHUB_WORKSPACE}/scripts/issue-bots.mjs`);
            const docs = JSON.parse(fs.readFileSync('data/claude-docs.json', 'utf8')).docs;
            await bots.runDocReview({ github, context, docs });
